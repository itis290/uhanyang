<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>anycall</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; display: grid; place-items: center;
  background: #7a7a7a;
  font-family: "Noto Sans KR", Gulim, "Malgun Gothic", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
input, textarea, button { font-family: inherit; }
button { font: inherit; cursor: pointer; border: none; background: none; }

#wrap { padding: 16px 10px; text-align: center; }
#hint { font-size: 11px; color: #eee; margin-top: 10px; opacity: .85; }

/* —— Anycall hardware —— */
.anycall {
  width: 318px;
  padding: 10px 10px 8px;
  border-radius: 22px;
  background: linear-gradient(165deg, #1a1a1a, #050505 40%, #222);
  box-shadow: 0 22px 48px #0007, inset 0 0 0 1px #444;
}
.anycall-speaker {
  width: 48px; height: 5px; margin: 0 auto 8px;
  border-radius: 3px; background: #0d0d0d;
}
.screen {
  position: relative;
  height: 502px;
  min-height: 502px;
  max-height: 502px;
  background: #111;
  border: 2px solid #000;
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.era2009 .screen-inner { background: #dfe2e6; }
.era2016 .screen-inner { background: #fff; }

.sbar {
  height: 20px; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 6px; font-size: 10px; font-weight: 600;
}
.era2009 .sbar { background: #000; color: #fff; }
.era2016 .sbar { background: #fafafa; color: #333; border-bottom: 1px solid #eee; }
.sb-r { display: flex; align-items: center; gap: 4px; font-size: 9px; }

#viewport { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

/* Anycall soft keys (on-screen) */
.soft2009 {
  height: 28px; flex-shrink: 0;
  background: #000;
  color: #fff;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 10px;
  font-size: 11px;
}
.soft2009 button { color: #fff; font-size: 11px; padding: 4px 2px; }
.soft2009 .mid { opacity: .4; font-size: 8px; }

.hw-keys {
  display: flex; justify-content: center; align-items: center;
  gap: 22px; margin-top: 10px; color: #888;
}
.hw-call, .hw-end {
  width: 44px; height: 28px;
  border: 1px solid #555; border-radius: 14px 14px 18px 18px;
  background: linear-gradient(#333, #111);
}
.hw-diamond {
  width: 38px; height: 28px;
  border: 2px solid #666;
  border-radius: 4px;
  background: linear-gradient(#2a2a2a, #0a0a0a);
  margin: 0 4px;
}

/* 2009 lock slide */
.standby {
  flex: 1; min-height: 0;
  background: linear-gradient(180deg, #1e3a5f, #0f2744);
  color: #fff; padding: 32px 16px 20px;
  display: flex; flex-direction: column;
}
.standby .big { font-size: 44px; font-weight: 300; letter-spacing: -1px; }
.standby .sub { font-size: 12px; margin-top: 6px; opacity: .9; }
.standby .widget {
  margin-top: 28px; padding: 12px;
  background: #ffffff18; border-radius: 8px;
  font-size: 12px; text-align: left;
}
.slide-unlock {
  margin-top: auto;
  background: #ffffff22;
  border-radius: 16px;
  padding: 10px;
  touch-action: none;
}
.slide-track {
  height: 36px; background: #00000055; border-radius: 18px;
  position: relative; overflow: hidden;
}
.slide-thumb {
  position: absolute; left: 2px; top: 2px;
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(#eee, #aaa);
  box-shadow: 0 2px 6px #0006;
}
.slide-label {
  line-height: 36px; text-align: center;
  font-size: 11px; color: #ffffffcc;
  pointer-events: none;
}

/* 2009 TouchWiz home */
.tw-home {
  flex: 1; min-height: 0;
  background: linear-gradient(180deg, #5b8ec4 0%, #3d6a9a 55%, #2a5080 100%);
  padding: 20px 14px 12px;
}
.tw-clock { color: #fff; font-size: 38px; font-weight: 300; text-shadow: 0 1px 4px #0005; }
.tw-date { color: #ffffffcc; font-size: 11px; margin-top: 2px; }
.tw-grid {
  margin-top: 36px;
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 20px 10px;
}
.tw-app {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  color: #fff; font-size: 10px; text-shadow: 0 1px 2px #0008;
}
.tw-app .ico {
  width: 54px; height: 54px; border-radius: 10px;
  display: grid; place-items: center; font-size: 28px;
  box-shadow: 0 3px 8px #0004, inset 0 1px #fff3;
}
.ico-tel { background: linear-gradient(#8fdf92, #3da842); }
.ico-msg { background: linear-gradient(#b8e0ff, #5090d0); }
.ico-gal { background: linear-gradient(#ffd98a, #d4a030); }
.ico-cal { background: linear-gradient(#fff, #ccc); color: #333; font-size: 16px; font-weight: 700; }
.ico-set { background: linear-gradient(#999, #555); }

/* Anycall title bar */
.ac-bar {
  flex-shrink: 0;
  background: linear-gradient(180deg, #5a6672 0%, #3d4650 45%, #2a3138 100%);
  color: #fff;
  border-bottom: 1px solid #1a1f24;
  box-shadow: inset 0 1px #ffffff33;
}
.ac-bar-row {
  display: grid; grid-template-columns: 56px 1fr 56px;
  align-items: center; min-height: 36px;
  font-size: 12px;
}
.ac-bar-row button { color: #e8eef5; font-size: 11px; padding: 8px 4px; }
.ac-bar-row .title { text-align: center; font-weight: 700; font-size: 15px; }
.ac-tab {
  background: linear-gradient(#6a8ab0, #4a6a90);
  padding: 4px 12px; font-size: 11px; color: #fff;
  display: inline-block; margin-left: 8px; margin-bottom: 4px;
  border-radius: 3px 3px 0 0;
}

.ac-view { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: #c8ccd2; }

/* lists */
.ac-list { flex: 1; overflow-y: auto; background: #fff; }
.ac-row {
  width: 100%; text-align: left; padding: 11px 12px;
  border-bottom: 1px solid #d5d5d5;
  font-size: 13px; background: #fff;
}
.ac-row:active { background: #e8f0fa; }
.ac-row .name { font-weight: 700; color: #222; }
.ac-row .prev { font-size: 12px; color: #666; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-row .meta { float: right; font-size: 10px; color: #999; font-weight: 400; }
.ac-row.dim { opacity: .55; pointer-events: none; }

/* Jiwon SMS chat (Anycall) */
.jiwon-chat {
  flex: 1; overflow-y: auto; padding: 10px 8px 8px;
  background: linear-gradient(180deg, #b8bcc4, #a8acb4);
  display: flex; flex-direction: column; gap: 7px;
}
.j-bubble {
  max-width: 72%; padding: 8px 11px;
  font-size: 13px; line-height: 1.45;
  border-radius: 10px;
  box-shadow: 0 1px 3px #0002;
}
.j-bubble.in {
  align-self: flex-start;
  background: linear-gradient(180deg, #fff, #f0f0f0);
  border: 1px solid #bbb;
  color: #111;
}
.j-bubble.out {
  align-self: flex-end;
  background: linear-gradient(180deg, #b8f055, #78c800 40%, #5aad00);
  border: 1px solid #4a9900;
  color: #fff;
  text-shadow: 0 1px #3a7a00;
  border-radius: 12px;
}
.j-compose {
  flex-shrink: 0;
  padding: 6px 8px 4px;
  background: linear-gradient(180deg, #d0d4da, #b8bcc4);
  display: flex; gap: 6px; align-items: center;
}
.j-compose input {
  flex: 1; min-width: 0;
  padding: 8px 10px; border-radius: 14px;
  border: 1px solid #999; font-size: 12px;
}
.j-send {
  padding: 7px 12px; border-radius: 14px;
  background: linear-gradient(#9ae040, #5aad00);
  color: #fff; font-size: 12px; font-weight: 700;
  border: 1px solid #4a9000;
}

/* call transition */
#callOverlay {
  position: absolute; inset: 0; z-index: 40;
  background: linear-gradient(180deg, #1a2838, #0a1018);
  color: #fff;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 24px;
}
#callOverlay.show { display: flex; animation: callFadeIn .4s ease; }
#callOverlay .avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(#6a8ab0, #3a5080);
  display: grid; place-items: center;
  font-size: 28px; margin-bottom: 14px;
}
#callOverlay .nm { font-size: 22px; font-weight: 300; }
#callOverlay .st { font-size: 13px; color: #aaa; margin-top: 8px; }
.screen-shift { animation: eraShift 1.8s ease forwards; }
@keyframes callFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes eraShift {
  0% { filter: none; }
  45% { filter: brightness(1.1); }
  70% { filter: brightness(2.5); opacity: .9; }
  100% { filter: brightness(1); opacity: 1; }
}

.toast {
  position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
  background: #000c; color: #fff; padding: 8px 14px; border-radius: 16px;
  font-size: 11px; z-index: 50; opacity: 0; transition: opacity .2s;
  pointer-events: none; white-space: nowrap;
}
.toast.on { opacity: 1; }

/* —— 2016 —— */
.home16 {
  flex: 1; min-height: 0;
  overflow-y: auto;
  background: linear-gradient(180deg, #1b2838, #243447 60%, #1a2530);
  padding: 28px 16px;
}
.home16 .clk { color: #fff; font-size: 46px; font-weight: 200; }
.home16 .dt { color: #ffffff99; font-size: 12px; margin-top: 4px; }
.grid16 {
  margin-top: 36px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 20px 8px;
}

.dock16 {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  box-sizing: border-box;

  display: flex;
  justify-content: space-evenly;
  align-items: center;

  padding: 14px 8px 24px;
  background: rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 0;
  z-index: 10;
}

.a16 { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #fff; font-size: 10px; }

.dock16 .a16 {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.a16 .ic {
  width: 52px; height: 52px; border-radius: 13px;
  display: grid; place-items: center; font-size: 20px;
  box-shadow: 0 3px 10px #0005;
}
.ic-k { background: #fee500; color: #3c1e1e; font-size: 9px; font-weight: 800; }
.ic-ig { background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf); color: #fff; }

.bar16 {
  flex-shrink: 0; padding: 12px 14px;
  background: #fff; border-bottom: 1px solid #eee;
  font-size: 16px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.bar16 .bk { color: #3897f0; font-size: 14px; }
.body16 { flex: 1; min-height: 0; overflow-y: auto; background: #fff; -webkit-overflow-scrolling: touch; }

.chat16 { background: #eee; flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
.b16 { max-width: 80%; padding: 9px 11px; border-radius: 16px; font-size: 13px; line-height: 1.5; }
.b16.in { background: #fff; align-self: flex-start; }
.b16.out { background: #ffe812; align-self: flex-end; }
.b16.grp-in { background: #fff; align-self: flex-start; border-radius: 4px 14px 14px 14px; }
.b16 .who { font-size: 10px; color: #3897f0; margin-bottom: 3px; font-weight: 600; }
.b16.photo {
  padding: 3px;
  background: #fff;
  max-width: 86%;
  box-shadow: 0 2px 8px #0002;
}
.b16.photo.out { background: #fff; padding: 3px; }
.b16.photo img {
  display: block;
  width: 188px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
  border-radius: 10px;
  background: #111;
}
.b16.photo .photo-cap {
  font-size: 10px;
  color: #888;
  padding: 4px 6px 2px;
}
.in16 { display: flex; gap: 6px; padding: 8px; background: #fafafa; border-top: 1px solid #ddd; flex-shrink: 0; }
.in16 input { flex: 1; border: 1px solid #ccc; border-radius: 18px; padding: 8px 12px; font-size: 13px; }
.in16 button { color: #3897f0; font-weight: 600; padding: 0 8px; }

/* Instagram 2016 feed */
.ig-top {
  flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid #efefef;
}
.ig-logo { font-size: 22px; letter-spacing: -1px; }
.ig-profile {
  padding: 16px; display: flex; gap: 16px; align-items: center;
  border-bottom: 1px solid #efefef;
}
.ig-av {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: url("assets/insta7.jpg") center / cover no-repeat;
  border: 2px solid #efefef;
}
.ig-stats { display: flex; gap: 18px; font-size: 13px; }
.ig-stats b { display: block; text-align: center; }
.ig-stats span { font-size: 11px; color: #666; }
.ig-bio { padding: 0 16px 12px; font-size: 13px; border-bottom: 1px solid #efefef; }
.ig-post { border-bottom: 1px solid #efefef; padding-bottom: 10px; margin-bottom: 4px; }
.ig-post-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
.ig-post-head .mini-av { width: 28px; height: 28px; border-radius: 50%; background: #ccc; }
.ig-photo {
  width: 100%; aspect-ratio: 1;
  background: #ddd center/cover no-repeat;
}
.ig-actions { padding: 8px 14px; font-size: 20px; letter-spacing: 8px; }
.ig-cap { padding: 0 14px; font-size: 13px; line-height: 1.5; }
.ig-cap b { margin-right: 6px; }
.ig-time { padding: 4px 14px 8px; font-size: 10px; color: #999; text-transform: uppercase; }

/* Music 2016 */
.ic-music { background: linear-gradient(#ff8a80, #e53935); color: #fff; }
.music-app { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #1c1c1e; color: #fff; }
.music-list { flex: 1; min-height: 0; overflow-y: auto; }
.song-row {
  width: 100%; text-align: left; color: #fff;
  padding: 14px 14px; border-bottom: 1px solid #333;
  display: flex; gap: 10px; align-items: center;
}
.song-row.on { background: #ffffff12; }
.song-art {
  width: 44px; height: 44px; border-radius: 6px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 18px;
}
.song-row .name { font-size: 14px; font-weight: 600; }
.song-row .prev { font-size: 11px; color: #aaa; margin-top: 3px; }
.player {
  flex-shrink: 0;
  padding: 12px 14px 16px;
  background: #111;
  border-top: 1px solid #333;
}
.player .now { font-size: 12px; color: #ccc; margin-bottom: 8px; }
.player .now b { color: #fff; font-weight: 600; }
.prog { height: 3px; background: #333; border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.prog i { display: block; height: 100%; width: 0; background: #ff5252; }
.player-btns { display: flex; justify-content: center; gap: 22px; align-items: center; }
.player-btns button { color: #fff; font-size: 18px; padding: 6px; }
.player-btns .play { width: 44px; height: 44px; border-radius: 50%; background: #ff5252; font-size: 16px; }

/* Gallery */
.gal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; background: #111; }
.gal-cell {
  aspect-ratio: 1; border: 0; padding: 0;
  background: #333 center/cover no-repeat;
}
.gal-detail { padding: 12px; }
.gal-detail img { width: 100%; border-radius: 4px; }
.gal-detail p { font-size: 12px; color: #666; margin-top: 8px; line-height: 1.6; }



/* ===== 추가 수정 ===== */
/* 스크롤바 숨김 */
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }

/* 2009 애니콜 옴니아 스타일 홈 */
.tw-home {
  display: flex; flex-direction: column; padding: 0;
  background:
    radial-gradient(120% 60% at 85% 20%, #4fd2ff99 0%, transparent 45%),
    radial-gradient(90% 50% at 30% 55%, #1aa7e866 0%, transparent 55%),
    linear-gradient(160deg, #0b1d3a 0%, #13427a 35%, #0a2a5a 60%, #050d1e 100%);
  position: relative; overflow: hidden;
}
.tw-home::before {
  content: ""; position: absolute; inset: -30% -40% 20% 10%;
  background: radial-gradient(closest-side, transparent 70%, #6fe3ff88 74%, #2bb6f055 80%, transparent 86%);
  transform: rotate(-25deg); pointer-events: none;
}
.tw-clock { position: relative; padding: 18px 14px 0; font-size: 34px; }
.tw-date { position: relative; padding: 0 14px; }
.tw-grid {
  position: relative; margin-top: auto;
  grid-template-columns: repeat(5, 1fr); gap: 0;
  background: linear-gradient(180deg, #1c2430ee, #05080ccc);
  border-top: 1px solid #ffffff33; padding: 6px 2px 4px;
}
.tw-app { font-size: 9px; gap: 2px; text-shadow: none; }
.tw-app .ico {
  width: 34px; height: 30px; border-radius: 6px; font-size: 18px;
  background: linear-gradient(#ffffff22, #ffffff08) !important; color: #fff !important;
  border: 1px solid #ffffff22; box-shadow: inset 0 1px #fff3;
}

/* 2016 터치위즈 스타일 홈 */
.home16 {
  background:
    radial-gradient(80% 40% at 70% 15%, #ffffffaa 0%, transparent 60%),
    radial-gradient(120% 70% at 20% 40%, #7fd0ff 0%, transparent 60%),
    linear-gradient(170deg, #4fb6ff 0%, #1e86e8 40%, #0a5fc4 75%, #063f8e 100%);
  padding: 16px 10px 110px;
}
.w16 {
  padding: 14px 14px 12px; border-radius: 6px;
  background: #ffffff2e; border: 1px solid #ffffff55;
  display: flex; justify-content: space-between; align-items: flex-start;
  box-shadow: inset 0 1px #fff6;
}
.w16 .clk { font-size: 44px; font-weight: 300; line-height: 1; text-shadow: 0 1px 3px #0004; }
.w16 .dt { color: #fff; }
.w16 .wx { color: #fff; text-align: right; font-size: 12px; }
.w16 .wx b { display: block; font-size: 26px; font-weight: 300; }
.grid16 { margin-top: 22px; gap: 16px 4px; }
.a16 { text-shadow: 0 1px 2px #0007; font-size: 10px; }
.a16 .ic {
  position: relative; overflow: hidden;
  width: 50px; height: 50px; border-radius: 12px;
  border: 1px solid #ffffff66;
  box-shadow: 0 3px 6px #0005;
}
.a16 .ic::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%;
  background: linear-gradient(#ffffff88, #ffffff22); border-radius: 12px 12px 40% 40%;
  pointer-events: none;
}
.dock16 {
  background: linear-gradient(180deg, #0a3d80dd, #031a40f0);
  border-top: 1px solid #ffffff44;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  padding: 8px 4px 10px;
}
.dock16 .a16 { gap: 4px; }

/* 2016 작대기 단체 문자방 (삼성 메시지) */
.grp16 { background: #c5d8f0; }
.grp16-bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: #5d8fd3; color: #fff;
}
.grp16-bar .bk { color: #fff; font-size: 18px; padding: 0 4px; }
.grp16-av {
  width: 32px; height: 32px; border-radius: 50%;
  background: #e8935a; color: #fff; display: grid; place-items: center;
  font-size: 13px; font-weight: 700;
}
.grp16-t { font-size: 14px; font-weight: 500; line-height: 1.2; }
.grp16-t small { display: block; font-size: 10px; opacity: .85; font-weight: 400; }
.grp16-more { margin-left: auto; color: #fff; font-size: 16px; }
.grp16 .chat16 { background: #c5d8f0; }
.grp16 .b16.out { background: #f4f8fd; border-radius: 14px 14px 2px 14px; color: #333; box-shadow: 0 1px 1px #0001; }
.grp16 .b16.grp-in { background: #fff; }
.grp16 .b16.photo.out { background: #f4f8fd; }
.grp-row { display: flex; align-items: flex-end; gap: 6px; }
.grp-av {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 700;
  letter-spacing: -.3px; box-shadow: 0 1px 1px #0002;
}
.grp16 .in16 { background: #eef3f9; border-top: 1px solid #b8c8de; align-items: center; }
.grp16 .in16 input { border-color: #b8c8de; background: #fff; }
.grp16 .in16 button[type=submit] { color: #5d8fd3; white-space: nowrap; }
.ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.ig-cell { aspect-ratio: 1; border: 0; padding: 0; background-size: cover !important; background-position: center !important; }

/* ===== v3.2 수정 ===== */
/* 말풍선 꼬리 공통 */
.b16, .j-bubble { position: relative; }
.b16.in, .b16.grp-in { border-radius: 4px 14px 14px 14px; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>

}

function initSlide() {
  const track = document.getElementById("slideTrack");
  const thumb = document.getElementById("slideThumb");
  if (!track || !thumb) return;
  let dragging = false;
  let startX = 0;
  let left = 2;

  function max() { return track.clientWidth - thumb.clientWidth - 4; }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    if (left >= max() * 0.82) {
      view = "home";
      render();
    } else {
      left = 2;
      thumb.style.left = "2px";
    }
  }

  function onMove(clientX) {
    if (!dragging) return;
    left = Math.max(2, Math.min(max(), clientX - startX));
    thumb.style.left = left + "px";
  }

  thumb.addEventListener("mousedown", e => {
    dragging = true;
    startX = e.clientX - left;
    e.preventDefault();
  });
  window.addEventListener("mousemove", e => onMove(e.clientX));
  window.addEventListener("mouseup", onEnd);
  thumb.addEventListener("touchstart", e => {
    dragging = true;
    startX = e.touches[0].clientX - left;
  }, { passive: true });
  window.addEventListener("touchmove", e => { if (dragging) onMove(e.touches[0].clientX); }, { passive: true });
  window.addEventListener("touchend", onEnd);
}

  document.getElementById("bk").onclick = () => { view = "gallery"; render(); };
}

function stopMusic() {
  musicPlaying = false;
  musicProgress = 0;
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  musicNodes.forEach(n => { try { n.stop(); } catch (e) {} });
  musicNodes = [];
  if (musicAudioCtx) {
    musicAudioCtx.close().catch(() => {});
    musicAudioCtx = null;
  }
}

function playMusicLoop(idx) {
  stopMusic();
  }

function renderMusic() {
  const t = musicTracks[musicIndex];
  vp.innerHTML = `
    <div class="music-app fade">
      <div class="bar16" style="background:#1c1c1e;color:#fff;border-color:#333"><button type="button" class="bk" id="bk" style="color:#ff5252">←</button>음악</div>
      <div class="music-list">
        ${musicTracks.map((s, i) => `
          <button type="button" class="song-row ${i === musicIndex ? "on" : ""}" data-i="${i}">
            <span class="song-art" style="background:${s.color}">${s.icon}</span>
            <div>
              <div class="name">${esc(s.title)}</div>
              <div class="prev">${esc(s.artist)}</div>
            </div>
          </button>`).join("")}
      </div>
      <div class="player">
        <div class="now">지금 재생 · <b>${esc(t.title)}</b> — ${esc(t.artist)}</div>
        <div class="prog"><i id="musicBar" style="width:${musicProgress}%"></i></div>
        <div class="player-btns">
          <button type="button" id="mPrev">⏮</button>
          <button type="button" class="play" id="mPlay">${musicPlaying ? "❚❚" : "▶"}</button>
          <button type="button" id="mNext">⏭</button>
        </div>
      </div>
    </div>`;
  document.getElementById("bk").onclick = () => { stopMusic(); goHome(); };
  vp.querySelectorAll(".song-row").forEach(btn => {
    btn.onclick = () => {
      playMusicLoop(+btn.dataset.i);
      renderMusic();
    };
  });
  document.getElementById("mPlay").onclick = () => {
    if (musicPlaying) stopMusic();
    else playMusicLoop(musicIndex);
    renderMusic();
  };
  document.getElementById("mPrev").onclick = () => {
    playMusicLoop((musicIndex + musicTracks.length - 1) % musicTracks.length);
    renderMusic();
  };
  document.getElementById("mNext").onclick = () => {
    playMusicLoop((musicIndex + 1) % musicTracks.length);
    renderMusic();
  };
}

function render() {
  callOverlay.classList.remove("show");
  if (view !== "music") stopMusic();
  if (era === 2009) {
    if (view === "lock") renderLock();
    else if (view === "home") renderHome2009();
    else if (view === "phone") renderPhone2009();
    else if (view === "sms") renderSmsInbox2009();
    else if (view === "sms-jiwon") renderJiwonSms();
    else { view = "home"; renderHome2009(); }
    return;
  }
  if (view === "home") renderHome2016();
  else if (view === "phone") renderPhone2016();
  else if (view === "sms") renderSmsList2016();
  else if (view === "sms-group") renderGroupSms();
  else if (view === "kakao") renderKakaoList();
  else if (view === "kakao-chat") renderKakaoChat();
  else if (view === "instagram") renderInstagram();
  else if (view === "gallery") renderGallery();
  else if (view.startsWith("gallery-")) renderGalleryDetail(+view.split("-")[1]);
  else if (view === "music") renderMusic();
  else { view = "home"; renderHome2016(); }
}

document.getElementById("skRight").onclick = () => {
  if (era !== 2009) return;
  if (view === "lock") return;
  else goHome();
};

document.getElementById("hwHome").onclick = () => {
  if (view === "lock") return;
  goHome();
};
document.getElementById("hwBack").onclick = () => {
  if (view === "lock") return;
  if (era === 2009) {
    if (view === "sms-jiwon") { view = "sms"; render(); return; }
    if (view === "home") { view = "lock"; render(); return; }
    if (view !== "home") { goHome(); return; }
  } else {
    if (view === "sms-group") { view = "sms"; render(); return; }
    if (view === "kakao-chat") { view = "kakao"; render(); return; }
    if (view.startsWith("gallery-")) { view = "gallery"; render(); return; }
    if (view === "music") { stopMusic(); goHome(); return; }
    if (view !== "home") goHome();
  }
};

setEra(2009);
view = "lock";
render();
</script>
</body>
</html>
